<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kanjis — língua japonesa</title>
<meta name="description" content="Kanjis: um espaço para entender a língua japonesa, com dicionário japonês-português, kanji, leitura em kana e frases de exemplo.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
  <div class="selo" aria-hidden="true">辞</div>
  <div><h1>Kanjis</h1><p>Língua japonesa</p></div>
</header>
<nav class="menu" aria-label="Seções do site">
  <a href="index.html" aria-current="page">Dicionário</a>
</nav>
<main>
  <h2>Dicionário</h2>
  <label for="busca">Buscar em japonês, romaji ou português</label>
  <input id="busca" type="search" autocomplete="off" placeholder="Ex.: água, mizu, 水">
  <p id="info"></p>
  <div id="lista"></div>
</main>
<footer>Kanjis · em construção.</footer>
<script src="palavras.js"></script>
<script>
(function(){
  var dados = window.PALAVRAS || [];
  var busca = document.getElementById("busca");
  var lista = document.getElementById("lista");
  var info = document.getElementById("info");
  function norm(t){return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
  function esc(t){var d=document.createElement("div");d.textContent=t||"";return d.innerHTML;}
  function card(p){
    return '<article class="item"><div class="k" lang="ja">'+esc(p.kanji)+'</div>'+
      '<div class="l"><span lang="ja">'+esc(p.kana)+'</span> · '+esc(p.romaji)+'</div>'+
      '<p class="m">'+esc(p.pt)+'</p>'+
      (p.ex?'<p class="e" lang="ja">'+esc(p.ex)+'<span lang="pt-BR">'+esc(p.exPt)+'</span></p>':'')+
      '</article>';
  }
  function mostrar(){
    var q = norm(busca.value);
    var r = !q ? dados : dados.filter(function(p){
      return [p.kanji,p.kana,p.romaji,p.pt].some(function(c){return norm(c).indexOf(q)>-1;});
    });
    info.textContent = !q ? dados.length+" palavras no dicionário" : r.length+" resultado(s)";
    lista.innerHTML = r.length ? r.map(card).join("") :
      '<p class="vazio">Nada encontrado. Tente outra grafia ou busque em romaji.</p>';
  }
  busca.addEventListener("input", mostrar);
  mostrar();
})();
</script>
</body>
</html>
